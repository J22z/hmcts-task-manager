spring.application.name=taskmanager

# Store tasks in a local H2 database so they remain saved after restarting the app.
spring.datasource.url=jdbc:h2:file:./data/taskdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Keep the database schema up to date without deleting existing tasks.
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the console while developing.
spring.jpa.show-sql=true

# Avoids keeping database sessions open during web requests.
spring.jpa.open-in-view=false

# Enables the H2 console for checking the database locally.
spring.h2.console.enabled=true

# Runs the backend on port 8080.
server.port=8080